plugins { id 'com.android.application' }

def releaseKeystore = System.getenv('STACKUP_UPLOAD_KEYSTORE')
def releaseStorePassword = System.getenv('STACKUP_UPLOAD_STORE_PASSWORD')
def releaseKeyAlias = System.getenv('STACKUP_UPLOAD_KEY_ALIAS')
def releaseKeyPassword = System.getenv('STACKUP_UPLOAD_KEY_PASSWORD')
def hasReleaseSigning = [releaseKeystore, releaseStorePassword, releaseKeyAlias, releaseKeyPassword].every { it != null && !it.trim().isEmpty() }

android {
    namespace 'com.skyare.stackupacademy'
    compileSdk 36

    defaultConfig {
        applicationId 'com.skyare.stackupacademy'
        minSdk 24
        targetSdk 36
        versionCode 226
        versionName '2.1.10'
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseKeystore)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (hasReleaseSigning) signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'com.android.billingclient:billing:9.1.0'
    implementation('androidx.biometric:biometric:1.1.0') {
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    }
    implementation('androidx.fragment:fragment:1.8.9') {
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    }
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
}
