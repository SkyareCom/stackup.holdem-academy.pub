name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Security repository guard
        run: node scripts/security-guard.js

      - name: Validate mobile layout contract
        run: node test-layout-contract.js

      - name: Validate definitive Academy web release
        run: |
          node test-layout-quality.js
          node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8')); console.log('manifest.webmanifest OK')"
          grep -q "StackUp Hold'em Academy" index.html
          grep -q 'serviceWorker.register("sw.js")' index.html
          grep -q 'const CACHE = "academy-' sw.js
          grep -q 'Remote-first' sw.js
          test -s privacy.html
          test -s auth-production.js
          test -s billing-production.js
          test -s icons/icon-192.png
          test -s icons/icon-512.png
          test -s icons/icon-maskable-192.png
          test -s icons/icon-maskable-512.png
          test -f .nojekyll

      - name: Prepare Pages artifact
        run: |
          rm -rf _site
          mkdir -p _site/icons
          cp index.html academy-premium-fiel.html privacy.html manifest.webmanifest sw.js auth-production.js billing-production.js .nojekyll _site/
          cp icons/icon-192.png icons/icon-512.png icons/icon-maskable-192.png icons/icon-maskable-512.png _site/icons/

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: './_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
