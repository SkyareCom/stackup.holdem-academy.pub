name: Deploy Academy Web Release

on:
  push:
    branches:
      - main
    paths:
      - 'new-academy/app/src/main/assets/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: academy-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Security repository guard
        run: node scripts/security-guard.js
      - name: Validate new Academy web release
        run: |
          test -s new-academy/app/src/main/assets/index.html
          test -s new-academy/app/src/main/assets/academy-content.js
          test -s new-academy/app/src/main/assets/assets/bg.js
          test -s new-academy/app/src/main/assets/assets/logo.js
      - name: Prepare Pages artifact
        run: |
          rm -rf _site
          mkdir -p _site
          cp -R new-academy/app/src/main/assets/. _site/
          touch _site/.nojekyll
      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - name: Upload artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: './_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
