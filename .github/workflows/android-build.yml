name: Build Android Packages

on:
  push:
    branches:
      - main
      - academy-publish-221-stackup-auth
    paths:
      - 'android/**'
      - 'new-academy/**'
      - '.github/workflows/android-build.yml'
      - 'scripts/security-guard.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.actor == 'SkyareCom'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: android-signing
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Security repository guard
        run: node scripts/security-guard.js


      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools

      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '9.6.0'

      - name: Prepare optional Play upload signing
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_UPLOAD_KEYSTORE_BASE64" ] && \
             [ -n "$ANDROID_UPLOAD_STORE_PASSWORD" ] && \
             [ -n "$ANDROID_UPLOAD_KEY_ALIAS" ] && \
             [ -n "$ANDROID_UPLOAD_KEY_PASSWORD" ]; then
            printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/stackup-upload.jks"
            chmod 600 "$RUNNER_TEMP/stackup-upload.jks"
            echo "STACKUP_SIGNING_READY=true" >> "$GITHUB_ENV"
          else
            echo "STACKUP_SIGNING_READY=false" >> "$GITHUB_ENV"
          fi

      - name: Run Android release lint
        run: gradle -p new-academy :app:lintRelease --stacktrace

      - name: Build release AAB and production APK
        env:
          STACKUP_UPLOAD_KEYSTORE: ${{ runner.temp }}/stackup-upload.jks
          STACKUP_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          STACKUP_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          STACKUP_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: gradle -p new-academy :app:bundleRelease :app:assembleRelease --stacktrace

      - name: Verify AAB integrity
        run: |
          AAB="new-academy/app/build/outputs/bundle/release/app-release.aab"
          test -s "$AAB"
          unzip -t "$AAB"
          sha256sum "$AAB" | tee "${AAB}.sha256"

      - name: Verify signed Play AAB
        if: ${{ env.STACKUP_SIGNING_READY == 'true' }}
        run: |
          AAB="new-academy/app/build/outputs/bundle/release/app-release.aab"
          jarsigner -verify -verbose -certs "$AAB"

      - name: Record and verify release metadata
        run: |
          mkdir -p new-academy/app/build/outputs/bundle/release
          APK="new-academy/app/build/outputs/apk/release/app-release.apk"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          BADGING="$($AAPT dump badging "$APK" | head -n 1)"
          VERSION_NAME="$(printf '%s\n' "$BADGING" | sed -n "s/.*versionName='\\([^']*\\)'.*/\\1/p")"
          VERSION_CODE="$(printf '%s\n' "$BADGING" | sed -n "s/.*versionCode='\\([^']*\\)'.*/\\1/p")"
          test "$VERSION_NAME" = "2.1.9"
          test "$VERSION_CODE" = "223"
          {
            echo "package=com.skyare.stackupacademy"
            echo "versionName=$VERSION_NAME"
            echo "versionCode=$VERSION_CODE"
            echo "targetSdk=36"
            echo "shell=webview-remote-first"
            echo "contentUrl=https://skyarecom.github.io/stackup.holdem-academy.pub/"
            echo "fallback=bundled-assets"
            echo "signed=${STACKUP_SIGNING_READY}"
          } > new-academy/app/build/outputs/bundle/release/RELEASE-INFO.txt

      - name: Verify production APK uses native WebView launcher
        if: ${{ env.STACKUP_SIGNING_READY == 'true' }}
        run: |
          APK="new-academy/app/build/outputs/apk/release/app-release.apk"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          test -s "$APK"
          "$AAPT" dump badging "$APK" | tee /tmp/stackup-release-badging.txt
          grep -q "package: name='com.skyare.stackupacademy'" /tmp/stackup-release-badging.txt
          grep -q "launchable-activity: name='com.skyare.stackupacademy.MainActivity'" /tmp/stackup-release-badging.txt
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml | tee /tmp/stackup-release-manifest.txt
          ! grep -q "com.google.androidbrowserhelper.trusted" /tmp/stackup-release-manifest.txt
          ! grep -q "android.support.customtabs.trusted" /tmp/stackup-release-manifest.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"

      - name: Build installable debug APK
        run: gradle -p new-academy :app:assembleDebug --stacktrace

      - name: Verify debug APK uses the same native launcher
        run: |
          APK="new-academy/app/build/outputs/apk/debug/app-debug.apk"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          "$AAPT" dump badging "$APK" | tee /tmp/stackup-debug-badging.txt
          grep -q "package: name='com.skyare.stackupacademy'" /tmp/stackup-debug-badging.txt
          grep -q "launchable-activity: name='com.skyare.stackupacademy.MainActivity'" /tmp/stackup-debug-badging.txt
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml | tee /tmp/stackup-debug-manifest.txt
          ! grep -q "com.google.androidbrowserhelper.trusted" /tmp/stackup-debug-manifest.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"

      - name: Verify bundled new Academy assets
        run: |
          AAB="new-academy/app/build/outputs/bundle/release/app-release.aab"
          unzip -l "$AAB" | grep -q "base/assets/index.html"
          unzip -l "$AAB" | grep -q "base/assets/academy-content.js"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Smoke test APK on Android 16 emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            test -s new-academy/app/build/outputs/apk/release/app-release.apk
            adb install -r new-academy/app/build/outputs/apk/release/app-release.apk
            adb shell pm list packages | grep -q "^package:com.skyare.stackupacademy$"

            adb logcat -c
            adb shell am force-stop com.skyare.stackupacademy
            adb shell am start -W -n com.skyare.stackupacademy/com.skyare.stackupacademy.MainActivity > /tmp/stackup-start.txt
            cat /tmp/stackup-start.txt
            grep -q "Status: ok" /tmp/stackup-start.txt
            grep -q "MainActivity" /tmp/stackup-start.txt
            mkdir -p android-diagnostics-api36
            sleep 10
            adb shell pidof com.skyare.stackupacademy
            adb logcat -d -v time > android-diagnostics-api36/logcat.txt
            cp /tmp/stackup-start.txt android-diagnostics-api36/start.txt
            adb exec-out screencap -p > android-diagnostics-api36/screen.png
            adb shell uiautomator dump /sdcard/stackup-window.xml || true
            adb pull /sdcard/stackup-window.xml android-diagnostics-api36/window.xml || true
            grep -E "StackUpAcademy|chromium|WebView|ERR_|FATAL" android-diagnostics-api36/logcat.txt | tail -n 240 || true
            ! grep -q "FATAL EXCEPTION.*com.skyare.stackupacademy" android-diagnostics-api36/logcat.txt

      - name: Smoke test APK on Android 14 emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            test -s new-academy/app/build/outputs/apk/release/app-release.apk
            adb install -r new-academy/app/build/outputs/apk/release/app-release.apk
            adb shell pm list packages | grep -q "^package:com.skyare.stackupacademy$"

            adb logcat -c
            adb shell am force-stop com.skyare.stackupacademy
            adb shell am start -W -n com.skyare.stackupacademy/com.skyare.stackupacademy.MainActivity > /tmp/stackup-start-api34.txt
            cat /tmp/stackup-start-api34.txt
            grep -q "Status: ok" /tmp/stackup-start-api34.txt
            grep -q "MainActivity" /tmp/stackup-start-api34.txt

            mkdir -p android-diagnostics-api34
            sleep 10
            adb shell pidof com.skyare.stackupacademy
            adb logcat -d -v time > android-diagnostics-api34/logcat.txt
            cp /tmp/stackup-start-api34.txt android-diagnostics-api34/start.txt
            adb exec-out screencap -p > android-diagnostics-api34/screen.png
            adb shell uiautomator dump /sdcard/stackup-window-api34.xml || true
            adb pull /sdcard/stackup-window-api34.xml android-diagnostics-api34/window.xml || true
            grep -E "StackUpAcademy|chromium|WebView|ERR_|FATAL" android-diagnostics-api34/logcat.txt | tail -n 240 || true
            ! grep -q "FATAL EXCEPTION.*com.skyare.stackupacademy" android-diagnostics-api34/logcat.txt

      - name: Upload Android runtime diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stackup-academy-android-runtime-diagnostics
          path: |
            android-diagnostics-api36/
            android-diagnostics-api34/
          if-no-files-found: warn

      - name: Upload Play AAB artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stackup-academy-play-aab
          path: |
            new-academy/app/build/outputs/bundle/release/*.aab
            new-academy/app/build/outputs/bundle/release/*.sha256
            new-academy/app/build/outputs/bundle/release/RELEASE-INFO.txt
          if-no-files-found: error

      - name: Upload installable test APK
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stackup-academy-android-test-apk
          path: new-academy/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
