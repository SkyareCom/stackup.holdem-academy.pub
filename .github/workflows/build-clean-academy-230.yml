name: Build Clean Academy Play AAB 234

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-clean-academy-230.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.actor == 'SkyareCom'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: android-signing

    steps:
      - name: Checkout publisher repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Checkout validated clean Academy source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: SkyareCom/stackup.holdem-academy.experiencia
          ref: dcc8db917d6c1bfc9bdd0f63690f1ae578474276
          path: source
          persist-credentials: false

      - name: Verify immutable approved source
        shell: bash
        run: |
          test -s source/app/src/main/assets/index.html
          test -s source/index.html
          cmp -s source/index.html source/app/src/main/assets/index.html
          grep -q "applicationId 'com.skyare.stackupacademy'" source/app/build.gradle
          grep -q "versionCode 234" source/app/build.gradle
          grep -q "versionName '2.1.18'" source/app/build.gradle
          grep -q 'file:///android_asset/index.html' source/app/src/main/java/com/skyare/stackupacademy/MainActivity.java
          ! grep -q 'skyarecom.github.io' source/app/src/main/java/com/skyare/stackupacademy/MainActivity.java

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools

      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '8.11.1'

      - name: Prepare Play upload signing
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_UPLOAD_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/stackup-upload.jks"
          chmod 600 "$RUNNER_TEMP/stackup-upload.jks"

      - name: Verify authentication build configuration
        env:
          STACKUP_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STACKUP_SUPABASE_PUBLISHABLE_KEY }}
        shell: bash
        run: |
          test -n "$STACKUP_SUPABASE_PUBLISHABLE_KEY"
          grep -q "BuildConfig.SUPABASE_PUBLISHABLE_KEY" source/app/src/main/java/com/skyare/stackupacademy/AuthConfig.java
          grep -q 'android:scheme="stackupacademy"' source/app/src/main/AndroidManifest.xml
          grep -q 'android:host="auth"' source/app/src/main/AndroidManifest.xml

      - name: Build signed release AAB and APK
        env:
          STACKUP_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STACKUP_SUPABASE_PUBLISHABLE_KEY }}
          STACKUP_UPLOAD_KEYSTORE: ${{ runner.temp }}/stackup-upload.jks
          STACKUP_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          STACKUP_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          STACKUP_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: gradle -p source :app:bundleRelease :app:assembleRelease --stacktrace

      - name: Verify Play package identity and version
        shell: bash
        run: |
          AAB="source/app/build/outputs/bundle/release/app-release.aab"
          APK="source/app/build/outputs/apk/release/app-release.apk"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          test -s "$AAB"
          test -s "$APK"
          unzip -t "$AAB"
          jarsigner -verify -verbose -certs "$AAB"
          "$AAPT" dump badging "$APK" | tee /tmp/academy-234-badging.txt
          grep -q "package: name='com.skyare.stackupacademy'" /tmp/academy-234-badging.txt
          grep -q "versionCode='234'" /tmp/academy-234-badging.txt
          grep -q "versionName='2.1.18'" /tmp/academy-234-badging.txt
          grep -q "launchable-activity: name='com.skyare.stackupacademy.MainActivity'" /tmp/academy-234-badging.txt

      - name: Verify AAB contains exact approved bundled front
        shell: bash
        run: |
          AAB="source/app/build/outputs/bundle/release/app-release.aab"
          unzip -p "$AAB" base/assets/index.html > /tmp/aab-index.html
          cmp -s /tmp/aab-index.html source/app/src/main/assets/index.html
          cmp -s source/index.html source/app/src/main/assets/index.html
          test "$(unzip -l "$AAB" | awk '$4=="base/assets/index.html"{n++} END{print n+0}')" -eq 1
          ! grep -Eiq 'github\.io|raw\.githubusercontent\.com|pages\.dev' /tmp/aab-index.html
          unzip -l "$AAB" | grep -q "base/assets/academy-content.js"
          unzip -l "$AAB" | grep -q "base/assets/assets/bg.js"
          unzip -l "$AAB" | grep -q "base/assets/assets/logo.js"

      - name: Record release metadata
        shell: bash
        run: |
          OUT="source/app/build/outputs/bundle/release"
          sha256sum "$OUT/app-release.aab" | tee "$OUT/app-release.aab.sha256"
          {
            echo "source_repo=SkyareCom/stackup.holdem-academy.experiencia"
            echo "source_commit=dcc8db917d6c1bfc9bdd0f63690f1ae578474276"
            echo "approved_front_source=validated-local-bundle"
            echo "package=com.skyare.stackupacademy"
            echo "versionName=2.1.18"
            echo "versionCode=234"
            echo "front=bundled-local-only"
            echo "remote_front=false"
          } > "$OUT/RELEASE-INFO.txt"

      - name: Upload clean Play AAB
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stackup-academy-play-234-clean
          path: |
            source/app/build/outputs/bundle/release/app-release.aab
            source/app/build/outputs/bundle/release/app-release.aab.sha256
            source/app/build/outputs/bundle/release/RELEASE-INFO.txt
          if-no-files-found: error
