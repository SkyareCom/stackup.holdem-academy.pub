name: Android PR Check

on:
  pull_request:
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/android-pr-check.yml'
      - '.github/workflows/android-build.yml'
      - 'scripts/security-guard.js'
      - 'index.html'
      - 'test-layout-quality.js'
      - 'test-layout-contract.js'
      - 'sw.js'
      - '.github/workflows/deploy-pages.yml'

permissions:
  contents: read

jobs:
  verify:
    if: github.actor == 'SkyareCom'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Security repository guard
        run: node scripts/security-guard.js

      - name: Validate Academy typography contract
        run: node test-layout-quality.js

      - name: Validate Academy web layout contract
        run: node test-layout-contract.js

      - name: Validate Android shell contract
        run: node android/test-shell-contract.js

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools

      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '9.6.0'

      - name: Lint release
        run: gradle -p android :app:lintRelease --stacktrace

      - name: Build debug APK
        run: gradle -p android :app:assembleDebug --stacktrace

      - name: Verify debug package and launcher
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          test -s "$APK"
          "$AAPT" dump badging "$APK" | tee /tmp/stackup-pr-badging.txt
          grep -q "package: name='com.skyare.stackupacademy.test220'" /tmp/stackup-pr-badging.txt
          grep -q "launchable-activity: name='com.skyare.stackupacademy.MainActivity'" /tmp/stackup-pr-badging.txt
